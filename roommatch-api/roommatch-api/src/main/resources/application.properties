
spring.application.name=roommatch-api

server.port=${SERVER_PORT:8081}



spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=roommatch_db;encrypt=false;trustServerCertificate=true}

spring.datasource.username=${DB_USERNAME:sa}

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}

jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.operations-sorter=method

springdoc.swagger-ui.tags-sorter=alpha

logging.level.root=${LOG_LEVEL_ROOT:INFO}

logging.level.com.roommatch=${LOG_LEVEL_ROOMMATCH:INFO}

logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE:WARN}

logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}