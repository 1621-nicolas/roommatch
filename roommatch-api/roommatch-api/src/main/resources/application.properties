spring.application.name=roommatch-api

server.port=${SERVER_PORT:8081}

spring.profiles.default=production

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:7200000}
jwt.issuer=${JWT_ISSUER:roommatch-production}
jwt.audience=roommatch-web

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.roommatch=${LOG_LEVEL_ROOMMATCH:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE:WARN}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}
