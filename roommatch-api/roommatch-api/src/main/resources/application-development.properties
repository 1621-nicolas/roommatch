# Explicit local profile: ./mvnw spring-boot:run -Dspring-boot.run.profiles=development
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=roommatch_db;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
# Blank JWT_SECRET generates an ephemeral key, lost at restart; no published fallback.
jwt.issuer=roommatch-development
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
